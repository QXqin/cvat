metadata:
  name: pth-dschoerk-transt
  namespace: cvat
  annotations:
    name: TransT
    type: tracker
    spec:

spec:
  description: Fast Online Object Tracking and Segmentation
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 120s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/trans-t

  build:
    image: cvat.pth.dschoerk.transt:latest-gpu
    baseImage: cvat.transt.base:latest

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 120000
      attributes:
        port: 32001
        maxRequestBodySize: 268435456 # 256MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
